name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Typecheck e build do frontend
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checar sintaxe do backend
        run: python -m compileall -q backend

      # `compileall` só prova que o arquivo é Python válido. Meia dúzia de erros que
      # derrubam a API acontecem no IMPORT, montando o router: rota com status 204 e corpo,
      # dependência mal declarada, response_model impossível. Sem este passo eles só
      # apareciam no health check, depois do deploy.
      #
      # Instala apenas as dependências leves e as versões FIXADAS. As pinadas importam: um
      # `-> None` num endpoint 204 passa no FastAPI 0.141 e é recusado no 0.115, que é o que
      # a imagem usa. OpenCV, easyocr e torch ficam de fora (~2 GB) — o código já os importa
      # tarde exatamente para que a API suba sem eles, e o teste confirma essa proteção.
      - name: Importar a API com as versões fixadas, sem OpenCV
        run: |
          python -m pip install -q \
            "$(grep -i '^fastapi==' backend/requirements.txt)" \
            "$(grep -i '^pydantic==' backend/requirements.txt)" \
            "$(grep -i '^aiosqlite==' backend/requirements.txt)" \
            "$(grep -i '^psychrolib==' backend/requirements.txt)" \
            "$(grep -i '^python-multipart==' backend/requirements.txt)" \
            "$(grep -i '^bcrypt==' backend/requirements.txt)" \
            "$(grep -i '^pyjwt==' backend/requirements.txt)"
          python - <<'PY'
          import importlib, sys

          class SemVisao:
              """Faz cv2/easyocr/torch faltarem, como numa instalação incompleta."""

              def find_spec(self, nome, caminho=None, alvo=None):
                  if nome in ("cv2", "easyocr", "torch"):
                      raise ImportError(f"{nome} indisponível de propósito neste teste")
                  return None

          sys.meta_path.insert(0, SemVisao())
          app = importlib.import_module("backend.main").app
          rotas = [r for r in app.routes if getattr(r, "path", "").startswith("/api")]
          print(f"{len(rotas)} rotas de /api registradas sem OpenCV.")
          assert rotas, "nenhuma rota registrada"

          # Rota nova nasce protegida porque o guard está no router — mas basta alguém
          # registrar um router sem a dependência para abrir a API inteira em silêncio.
          # Esta é a única checagem que percebe isso, e ela custa cinco linhas.
          from backend.services.guardas import exigir_usuario, usuario_atual

          PUBLICAS = {"/api/auth/login", "/api/auth/refresh", "/api/auth/logout"}
          abertas = []
          for rota in rotas:
              if rota.path in PUBLICAS:
                  continue
              deps = {d.call for d in getattr(rota, "dependant", None).dependencies}
              if not deps & {exigir_usuario, usuario_atual}:
                  abertas.append(f"{sorted(rota.methods)} {rota.path}")
          assert not abertas, f"rotas sem autenticação: {abertas}"
          print(f"{len(rotas) - len(PUBLICAS)} rotas exigem sessão; {len(PUBLICAS)} públicas.")
          PY

      - name: Conferir que as migrações aplicam num banco vazio
        run: |
          python - <<'PY'
          import asyncio, os, tempfile

          os.environ["CARTA_DB_PATH"] = os.path.join(tempfile.mkdtemp(), "ci.db")
          from backend.database import init_db
          from backend.migrations import MIGRACOES

          versao = asyncio.run(init_db())
          esperada = max(numero for numero, _ in MIGRACOES)
          print(f"schema na versão {versao} (esperada {esperada})")
          assert versao == esperada, "as migrações não chegaram à última versão"
          PY

      - name: Validar os arquivos do compose
        run: |
          docker compose -f docker-compose.yml config -q
          # O compose de produção referencia variáveis que só existem no .env da VPS.
          APP_DOMAIN=exemplo.com \
          LETSENCRYPT_EMAIL=ci@exemplo.com \
          NGINX_PROXY_NETWORK=proxy \
            docker compose -f docker-compose.server.yml config -q

      - name: Conferir que o gabarito do OCR está versionado
        run: test -f backend/assets/mahu_template.png

  deploy:
    name: Deploy na VPS
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Chave pública do host fixada em segredo: sem isso o primeiro deploy aceitaria
          # qualquer servidor que atendesse naquele IP.
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Atualizar e subir
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ vars.VPS_PATH || '/home/mahu-entalpia' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$VPS_PATH' COMMIT='${{ github.sha }}' bash -euo pipefail -s" <<'REMOTO'
          cd "$APP_DIR"

          echo "::group::Atualizando o código"
          git fetch --prune origin
          # reset --hard preserva arquivos não rastreados, então o .env da VPS sobrevive.
          git reset --hard "$COMMIT"
          git --no-pager log -1 --format='  %h %s (%an)'
          echo "::endgroup::"

          echo "::group::Construindo as imagens"
          docker compose -f docker-compose.server.yml build
          echo "::endgroup::"

          echo "::group::Subindo os serviços"
          docker compose -f docker-compose.server.yml up -d --remove-orphans
          echo "::endgroup::"
          REMOTO

      - name: Health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ vars.VPS_PATH || '/home/mahu-entalpia' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$VPS_PATH' bash -euo pipefail -s" <<'REMOTO'
          cd "$APP_DIR"
          COMPOSE="docker compose -f docker-compose.server.yml"

          # O backend carrega os modelos de OCR na primeira leitura, mas o /
          # responde antes disso; start_period do healthcheck é 30 s.
          echo "Aguardando o backend ficar saudável..."
          for tentativa in $(seq 1 30); do
            estado=$($COMPOSE ps --format '{{.Health}}' backend 2>/dev/null | head -1)
            [ "$estado" = "healthy" ] && { echo "  backend: healthy"; break; }
            if [ "$tentativa" = "30" ]; then
              echo "  backend não ficou saudável (último estado: '${estado:-desconhecido}')"
              $COMPOSE logs --tail 50 backend
              exit 1
            fi
            sleep 5
          done

          # Exercita o caminho real: nginx do container -> backend -> SQLite.
          #
          # Três detalhes que fazem este bloco funcionar:
          #  - 127.0.0.1 e não localhost: o nginx.conf tem só `listen 80` (IPv4) e o
          #    /etc/hosts do Alpine resolve localhost para ::1 primeiro, dando
          #    "Connection refused" mesmo com tudo no ar.
          #  - `< /dev/null` em todo `exec`: sem isso ele consome o stdin, que aqui é o
          #    próprio heredoc, e o resto do script é engolido sem executar nem avisar.
          #  - a URL entre aspas: sem elas o bash trata o ? como glob.
          echo "Checando o frontend e o proxy para /api..."
          $COMPOSE exec -T frontend wget -q -T 10 -O /dev/null http://127.0.0.1/ < /dev/null \
            || { echo "  frontend não respondeu"; $COMPOSE logs --tail 50 frontend; exit 1; }

          # A rota exige sessão desde a migração 8, então a resposta CERTA aqui é 401 — e ela
          # prova as duas coisas de uma vez: o caminho nginx -> backend -> SQLite está de pé,
          # e a API está fechada. Um 200 aqui seria a falha grave, não o 401.
          #
          # `-S` manda os cabeçalhos para o stderr, e o `|| true` é obrigatório: o wget do
          # busybox sai diferente de zero em qualquer status de erro HTTP, e com pipefail
          # ligado isso derrubaria o passo antes de podermos ler a resposta.
          echo "Checando que /api exige sessão..."
          cabecalhos=$($COMPOSE exec -T frontend \
            wget -q -T 10 -S -O /dev/null 'http://127.0.0.1/api/simulacoes?limite=1' \
            < /dev/null 2>&1 || true)
          case "$cabecalhos" in
            *401*) echo "  API respondeu 401 como esperado (rota protegida)." ;;
            *200*) echo "  FALHA: /api/simulacoes respondeu 200 SEM sessão."; exit 1 ;;
            *) echo "  proxy /api não respondeu:"; echo "$cabecalhos"
               $COMPOSE logs --tail 50 backend; exit 1 ;;
          esac

          echo "Deploy verificado."
          REMOTO

      # Roda DEPOIS do deploy e na VPS, e não no runner, porque o corpus mora no volume
      # `carta-db` junto com as fotos: no GitHub não existe nada para medir.
      #
      # Não bloqueia. O deploy já aconteceu, e reprovar aqui não desfaz nada — o que este
      # passo entrega é o sinal de que o perfil vigente passou a produzir erro silencioso
      # sobre as leituras que os usuários rotularam. Reverter sozinho é a Fase 4.
      - name: Medir o OCR contra o corpus acumulado
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ vars.VPS_PATH || '/home/mahu-entalpia' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$VPS_PATH' bash -euo pipefail -s" <<'REMOTO'
          cd "$APP_DIR"
          docker compose -f docker-compose.server.yml run --rm --no-deps \
            -v "$APP_DIR/scripts:/scripts:ro" \
            backend python /scripts/avaliar_corpus.py
          REMOTO

      - name: Limpar imagens órfãs
        if: success()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            'docker image prune -f --filter "until=168h"'

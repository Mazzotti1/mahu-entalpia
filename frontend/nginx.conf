server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A API recusa acima de 15 MB com uma mensagem própria; o teto aqui fica logo acima
    # para que seja ela a responder, e não o 413 genérico do nginx.
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # `always` para que os cabeçalhos saiam também nas respostas de erro — um 401 ou um 500
    # é servido do mesmo domínio e merece as mesmas proteções.
    #
    # DENY em frames: a sessão é cookie, e sem isto outro site poderia embutir a aplicação
    # numa moldura invisível e induzir cliques na sessão de quem estivesse logado.
    add_header X-Frame-Options "DENY" always;
    # Impede o navegador de adivinhar o tipo de um arquivo pelo conteúdo, que é como um
    # upload vira script executado na própria origem.
    add_header X-Content-Type-Options "nosniff" always;
    # Sem isto o caminho completo da página vaza no Referer de qualquer link externo.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nada aqui usa câmera de terceiros nem geolocalização; o getUserMedia da leitura do
    # painel roda na própria origem, que `self` continua permitindo.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;

    # Proxy na mesma origem: o navegador nunca fala direto com o backend, então não há CORS.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O OCR roda em CPU e leva ~20 s, e a primeira leitura ainda baixa os modelos:
        # o default de 60 s cortaria a requisição no meio.
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # A foto vai inteira num POST: sem isso o nginx bufferiza tudo em disco antes de enviar.
        proxy_request_buffering off;
        # O SSE de /api/simulacoes/stream precisa que a resposta saia sem buffer. O backend
        # manda X-Accel-Buffering: no naquela rota, que o nginx respeita; esta linha é o
        # cinto de segurança caso o cabeçalho se perca.
        proxy_buffering off;
    }

    # Os assets do Vite têm hash no nome, então podem ser cacheados indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

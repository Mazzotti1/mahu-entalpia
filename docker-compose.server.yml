services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TORCH_INDEX_URL: "${TORCH_INDEX_URL-https://download.pytorch.org/whl/cpu}"
    image: ${BACKEND_IMAGE:-carta-psicrometrica-backend}
    environment:
      CARTA_DB_PATH: /data/simulador.db
      EASYOCR_MODULE_PATH: /models/easyocr
      CARTA_CORS_ORIGINS: "${CARTA_CORS_ORIGINS:-}"
      # `:?` e não `:-`: sem o segredo no .env da VPS o compose recusa subir aqui, com o
      # nome da variável na mensagem. O backend também se recusaria, mas só depois de o
      # container existir e o healthcheck falhar trinta vezes.
      CARTA_JWT_SECRET: "${CARTA_JWT_SECRET:?defina CARTA_JWT_SECRET no .env da VPS}"
      # Tira o Swagger do ar e exige Secure nos cookies de sessão.
      CARTA_ENV: production
    volumes:
      - carta-db:/data
      - easyocr-models:/models/easyocr
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
    image: ${FRONTEND_IMAGE:-carta-psicrometrica-frontend}
    environment:
      - VIRTUAL_HOST=${APP_DOMAIN}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${APP_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
      - internal

volumes:
  carta-db:
  easyocr-models:

networks:
  proxy:
    external: true
    name: ${NGINX_PROXY_NETWORK}
  internal:
    driver: bridge
